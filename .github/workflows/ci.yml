name: CI

# ═══════════════════════════════════════════════════════════════════════════
#  INTÉGRATION CONTINUE
# ═══════════════════════════════════════════════════════════════════════════
#
# ── Aucun secret requis ─────────────────────────────────────────────────────
#
# `next build` interroge la base pendant le prérendu (§19 du projet) : ce
# job démarre donc un PostgreSQL ÉPHÉMÈRE, propre à ce run, migré PUIS amorcé
# via le même `db:seed` que le projet utilise déjà en local. Le code tolère
# une base vide pour la plupart des requêtes (findMany/findFirst, jamais les
# variantes *OrThrow ; chaque section se masque sans donnée plutôt que de
# planter — Certifications, GitHub Stats…), mais Cache Components impose une
# règle propre à `generateStaticParams` : elle DOIT rendre au moins un
# résultat pour un segment dynamique (`/projects/[slug]`), sans quoi le build
# échoue à la validation. Semer au moins un projet publié est donc requis —
# une base migrée-mais-vide ne suffit pas ici.
#
# Le contenu semé est le contenu ÉDITORIAL RÉEL du portfolio (celui déjà
# public sur le site en production) : rien d'inventé pour la CI. Le script
# est idempotent (upsert) et ne crée AUCUN compte administrateur tant que
# ADMIN_EMAIL/ADMIN_PASSWORD ne sont pas fournis — ils ne le sont
# volontairement pas ici, la CI n'a besoin de se connecter à aucun compte.
#
# AUTH_SECRET ci-dessous n'est PAS un secret réel : c'est une valeur jetable,
# recréée à chaque run, qui ne protège aucune donnée et ne sert qu'à
# satisfaire la validation de src/lib/env.ts pendant le build. La production
# sur Vercel utilise un AUTH_SECRET totalement distinct, jamais présent ici.
#
# STORAGE_PROVIDER=local évite toute dépendance à Cloudinary : le build ne
# téléverse aucun média, et le code bascule déjà sur le stockage local quand
# les clés Cloudinary sont absentes (comportement documenté, pas un
# contournement ajouté pour la CI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci
      AUTH_SECRET: ci-only-placeholder-value-not-a-real-secret-0000
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STORAGE_PROVIDER: local

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Générer les types de routes Next.js
        # `tsconfig.json` référence `.next/types/**` (props générées pour
        # chaque layout/page — `LayoutProps` par exemple). Sur un poste de
        # développement, ce dossier existe déjà grâce aux `next dev`/`build`
        # précédents ; sur une machine CI fraîche, personne ne l'a jamais créé.
        # `next typegen` le génère sans lancer de build complet, ni toucher à
        # la base de données.
        run: npx next typegen

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm run test:run

      - name: Appliquer les migrations (base éphémère du job)
        run: npx prisma migrate deploy

      - name: Amorcer le contenu éditorial réel (base éphémère du job)
        run: npm run db:seed

      - name: Build de production
        run: npm run build
